name: Deploy to Cloud Run

on:
  push:
    branches: [main]

# One deploy at a time, in push order.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  PROJECT_ID: detect-sysmlv2
  REGION: us-central1
  # Deploying over the existing service keeps its URL.
  SERVICE: detect-webapp
  IMAGE: us-central1-docker.pkg.dev/detect-sysmlv2/detect/detect-webapp:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation: no service account key is stored in GitHub.
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-deploy@detect-sysmlv2.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # The licence is mounted from Secret Manager at the path the Dockerfile's
      # SYSIDE_LICENSE_FILE points at, so it never enters the image or this log.
      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --service-account "detect-webapp-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            --set-secrets "/secrets/syside-license.lic=syside-license:latest" \
            --port 8080 \
            --allow-unauthenticated \
            --quiet
